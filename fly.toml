# Required secrets (fly secrets set; names only, never values here):
#   HARNESS_API_KEY          bearer key for /v1 and /mcp
#   CLAUDE_CODE_OAUTH_TOKEN  runner auth for Claude Code
#   SPRITES_TOKEN            Sprites API token
#   webhook signing key      name set by the webhook fan-out ticket
#   secret-encryption key    name set by the secrets ticket

app = "REPLACE_ME"            # placeholder: app name chosen at deploy
primary_region = "REPLACE_ME" # placeholder: region code chosen at deploy, e.g. "iad"

# Fly's default is SIGINT; the API drains only on SIGTERM, and as PID 1 it ignores unhandled signals
kill_signal = "SIGTERM"

[env]
  DATA_DIR = "/data"

# single machine + single volume: the SQLite file is one unreplicated copy, so the volume needs snapshots
[mounts]
  source = "harness_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
